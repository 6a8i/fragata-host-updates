name: Update the testing channel

# Every day, compares the latest XCP-ng 8.3 packages (base, updates, LINSTOR) with those the published channel is
# made of. When they changed:
# - without the signing key in the secrets, the run summary lists the changes, to build the channel by hand
#   (scripts/packages of fragata-host);
# - with it (FRAGATA_SIGNING_KEY: the armored secret key, FRAGATA_SIGNING_PASSPHRASE: its passphrase), it rebuilds
#   the changed packages from their sources (scripts/phase2 of fragata-host, in the buildroot of Fragata Host made
#   from the published channel and its buildroot repository), checks and signs them (a package that does not build
#   stays the upstream binary), and publishes them in the testing channel 8.3-testing (repository fragata-testing of
#   the hosts) and the other rebuilt packages in the buildroot repository.
# The workflow "Promote the testing channel" then makes 8.3-testing the 8.3 channel.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: channel

env:
  VERSION: '8.3'
  GH_TOKEN: ${{ github.token }}

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      # https://github.com/actions/checkout
      - name: Scripts of the channel
        uses: actions/checkout@v4
        with:
          repository: 6a8i/fragata-host
          path: fragata-host

      - name: Select the packages
        run: |
          S=fragata-host/scripts/packages
          python3 $S/select-packages.py $S/base-packages.txt selection.tsv $S/extras.txt

      - name: Compare with the published channel
        id: compare
        run: |
          site=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}
          echo "site=$site" >>"$GITHUB_OUTPUT"
          # the testing channel when there is one, else the stable one
          for channel in $VERSION-testing $VERSION; do
            curl -sfL "$site/$channel/selection.tsv" -o published.tsv && { echo "base=$channel" >>"$GITHUB_OUTPUT"; break; }
          done
          [ -f published.tsv ] || { echo "no published selection" >&2; exit 1; }
          if cmp -s selection.tsv published.tsv; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "The channel is up to date with XCP-ng $VERSION." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "changed=true" >>"$GITHUB_OUTPUT"
          {
            echo "### XCP-ng $VERSION packages changed"
            echo
            echo '```diff'
            diff <(cut -f3 published.tsv | xargs -n1 basename | sort) <(cut -f3 selection.tsv | xargs -n1 basename | sort) | grep '^[<>]' | sed 's/^</-/; s/^>/+/' || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Signing key
        id: key
        if: steps.compare.outputs.changed == 'true'
        env:
          KEY: ${{ secrets.FRAGATA_SIGNING_KEY }}
          PASSPHRASE: ${{ secrets.FRAGATA_SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$KEY" ]; then
            echo "available=false" >>"$GITHUB_OUTPUT"
            echo "No signing key in the secrets: build the channel with scripts/packages of fragata-host." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -m 700 keys
          printf '%s\n' "$KEY" >keys/fragata-signing.secret.asc
          printf '%s' "$PASSPHRASE" >keys/passphrase.txt
          curl -sfL "${{ steps.compare.outputs.site }}/RPM-GPG-KEY-fragata" -o keys/RPM-GPG-KEY-fragata
          echo "available=true" >>"$GITHUB_OUTPUT"

      - name: Published packages
        if: steps.key.outputs.available == 'true'
        run: |
          site=${{ steps.compare.outputs.site }}/${{ steps.compare.outputs.base }}
          mkdir -p build/repo/packages build/own
          # the signed packages and their manifest: only the new packages are signed and uploaded
          # from the release of the build of that channel (the first builds: packages-<version>)
          release=$(curl -sfL "$site/release.txt" || echo "packages-$VERSION")
          gh release download "$release" -R "$GITHUB_REPOSITORY" -D build/repo/packages -p '*.rpm'
          curl -sfL "$site/signed.tsv" -o build/repo/signed.tsv
          # the Fragata packages of the channel
          curl -sfL "$site/own.txt" -o own.txt
          while read -r name; do mv "build/repo/packages/$name" build/own/; done <own.txt
          cp selection.tsv build/

      - name: Rebuild the changed packages from their sources
        if: steps.key.outputs.available == 'true'
        env:
          ENGINE: docker
          BUILD_ENV: fragata
          BUILD_CPUS: '4'
          BUILD_MEMORY: 5g
          TIMEOUT: '14400'
        run: |
          S=fragata-host/scripts/phase2
          site=${{ steps.compare.outputs.site }}
          mkdir -p rebuild build/rebuilt
          # the packages that changed (name, location): their source packages are rebuilt
          changed=$(comm -13 <(cut -f1,3 published.tsv | sort) <(cut -f1,3 selection.tsv | sort) | cut -f1)
          [ -n "$changed" ] || { echo "no changed package to rebuild"; exit 0; }
          python3 $S/select-sources.py selection.tsv rebuild/sources.tsv
          # the buildroot image: the published rebuilt packages (the channel and its buildroot repository) and the
          # archives of CentOS 7.9 and EPEL 7
          docker run --rm ghcr.io/xcp-ng/xcp-ng-build-env:8.3 cat /etc/pki/rpm-gpg/RPM-GPG-KEY-EPEL-7 >rebuild/RPM-GPG-KEY-EPEL-7
          cp $S/buildroot.repo rebuild/
          BUILDROOT_URLS="$site/${{ steps.compare.outputs.base }}/x86_64/ $site/buildroot-$VERSION/x86_64/" \
            sh $S/make-buildroot.sh rebuild
          sh $S/rebuild-srpms.sh rebuild/sources.tsv rebuild $changed
          sudo chown -R "$(id -u):$(id -g)" rebuild
          cp rebuild/rpms/*/*.rpm build/rebuilt/ 2>/dev/null || true
          {
            echo "### Rebuilt from their sources"
            echo
            echo '```'
            cat rebuild/results.tsv
            echo '```'
            echo "A source package that failed to build stays the upstream binary in the channel (its log is in the run)."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Build and sign
        if: steps.key.outputs.available == 'true'
        run: |
          docker run --rm -v "$PWD/fragata-host/scripts/packages:/scripts:ro" -v "$PWD/build:/build" \
            -v "$PWD/keys:/keys:ro" --user root ghcr.io/xcp-ng/xcp-ng-build-env:8.3 \
            sh /scripts/build-repo.sh /build/selection.tsv /build/own /keys /build/repo \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/packages-$VERSION-$(date -u +%Y%m%d%H%M)/" \
            /build/rebuilt
          sudo chown -R "$(id -u):$(id -g)" build

      - name: Publish the testing channel
        if: steps.key.outputs.available == 'true'
        run: |
          sh fragata-host/scripts/packages/publish-repo.sh build/repo "$GITHUB_REPOSITORY" "$VERSION" testing
          echo "Published in the testing channel $VERSION-testing: test it, then run \"Promote the testing channel\"." >>"$GITHUB_STEP_SUMMARY"

      - name: Publish the buildroot repository
        if: steps.key.outputs.available == 'true'
        run: |
          ls build/rebuilt/*.rpm >/dev/null 2>&1 || { echo "no rebuilt package"; exit 0; }
          sudo apt-get install -y -q createrepo-c >/dev/null
          sh fragata-host/scripts/phase2/publish-buildroot.sh build/rebuilt build/repo/rebuilt.txt "$GITHUB_REPOSITORY" "$VERSION"

      - name: Remove the key
        if: always()
        run: rm -rf keys
